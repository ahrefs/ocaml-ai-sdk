[package]
name = "tiny-js-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Sandboxed QuickJS VM, one per process, speaking length-prefixed CBOR over stdio"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tiny-js-sandbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
landlock = "0.4"
libc = "0.2"
rquickjs = { version = "0.14", features = ["loader"] }
seccompiler = "0.5"
minicbor = { version = "2", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
